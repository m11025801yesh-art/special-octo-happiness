ructure:"日历场景 → 追问目的 → 诊断定位 → 规划对照 → 行动引导",format:"两张计划示意卡＋俯拍＋报告实拍",facts:["diagnosis","price"],shots:[["0–5s","周末课表排得很满，每一项是在补什么？","俯拍标注“情景示意”的计划卡，指向其中一项。","这项任务，解决什么？","引出任务目的"],["5–15s","“做题一小时”是时间，“复习数学”是科目。它们还没有回答：孩子现在具体哪部分需要补，为什么先安排这一项。","白板区分时间、学科和具体薄弱项。","时间不等于学习目标","明确规划的信息缺口"],["15–30s","这套方案先提供一对一学情诊断，拆开学科、章节、知识点，再给出学习规划。让你先知道安排的依据，再去看时间怎么放。","展示真实诊断到规划的样例，指出实际有依据的安排。","有依据，再安排","把诊断价值转为视觉证据"],["30–45s","现在拿其中一项对照：报告里是什么问题，规划里建议先做什么。不要只看表格漂不漂亮，要看问题和动作能不能接上。","同屏呈现匿名报告与对应规划项，保持文字可读。","看对应关系，不只看表格","帮助用户判断服务"],["45–55s","当前九块九，纯虚拟交付。想把学习安排问得更具体，可以点开详情看看诊断和规划的服务方式。","真实权益页显示价格与服务方式。","9.9 元 · 看清服务方式","降低了解门槛"]],proof:["真实规划项确有诊断依据","无个人身份信息的报告画面"],objection:"担心只是拿到通用模板。",response:"同屏核对具体问题与具体安排，避免只展示漂亮排版。",test:["第一镜画面","先出镜讲“课表排得很满”。","先俯拍满日历并圈出一项任务。","3 秒留存","完播率"],unresolved:"不能仅凭一张示例规划承诺所有用户获得同等细节；需要核对实际服务标准。"},{code:"B04",line:"B",title:"先别把所有错题，都叫粗心",audience:"经常把孩子错题归因于粗心的家长",hypothesis:"“粗心”标签可能掩盖仍需了解的知识问题或步骤问题。",angle:"不替孩子下诊断，先把一个笼统标签转成能讨论的问题。",structure:"常见标签 → 追问细节 → 服务定位 → 样例展示 → 行动引导",format:"便签替换＋白板追问＋真人讲述",facts:["diagnosis","price"],shots:[["0–5s","又说孩子“粗心”之前，能说清是哪一步出了问题吗？","将写有“粗心”的便签拿开，露出“哪一步？”卡片。","先问具体卡点","替换笼统标签"],["5–15s","条件没看清、概念没理解、步骤没接上，需要进一步了解的地方并不相同。只留下两个字，下一次到底怎么准备，还是说不清。","白板列出待了解的三种可能，均带问号。","原因需要了解，不能猜","提示诊断必要性"],["15–30s","这套方案包含一对一学情诊断与学习规划，先梳理孩子的薄弱项，再看先补什么、后补什么。我们不靠一句话给孩子贴标签。","展示诊断服务流程和获准展示的匿名样例，不夸大检测能力。","诊断薄弱项，再看安排","解释服务作用"],["30–45s","你可以重点核对真实报告里的结论，有没有接到具体学习安排。涉及哪些知识点、下一步学哪部分，尽量让家长和孩子都能问得明白。","报告与规划并排，指向同一知识点。","结论要接上下一步","显示规划的可用性"],["45–55s","如果你想把“粗心”换成更具体的讨论，可以看九块九方案的诊断说明。先了解服务内容，再决定。","真实详情页展示诊断规划权益。","9.9 元 · 先看诊断说明","给出不夸大的行动入口"]],proof:["真实诊断服务所支持的信息范围","样例报告和学习规划"],objection:"家长担心被指责教育方式，或以为能识别所有心理原因。",response:"邀请具体讨论，不归责家长，不宣称诊断心理或注意力问题。",test:["开头语气","先别把所有错题都叫粗心。","孩子说自己粗心，下一步该问什么？","3 秒留存","CTR"],unresolved:"该服务是学情诊断，不是心理、医疗或注意力障碍诊断，脚本不扩展到这些能力。"},{code:"B05",line:"B",title:"一份报告，最后有没有下一步？",audience:"对测评报告的实际价值持怀疑态度的家长",hypothesis:"家长可能认为测评只是列问题，不能支持下一步行动。",angle:"用“报告和规划是否对应”作为可验证的服务评估标准。",structure:"
