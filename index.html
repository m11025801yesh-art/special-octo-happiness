弱点的家长",hypothesis:"家长对问题的描述可能停留在学科层面，无法直接转成学习任务。",angle:"通过逐级缩小问题，直观展示诊断的颗粒度。",structure:"笼统标签 → 逐层追问 → 诊断样例 → 规划落点 → 行动引导",format:"镜头递进推近＋白板层级＋匿名报告",facts:["diagnosis","price"],shots:[["0–5s","“孩子数学不好”，具体是数学的哪里？","镜头给出“数学不好”便签，随后打一个问号。","数学的哪里？","让观众意识到问题过大"],["5–15s","说到立体几何，再问一句：是空间关系分不清，还是某个知识点没掌握？问题越具体，下一步才越容易说清楚。","白板从学科缩小到章节和知识点；仅作提问示意。","学科 → 章节 → 知识点","建立具体定位的价值"],["15–30s","这套方案提供一对一学情诊断，把薄弱项拆开，再给出学习规划。实际报告里能拆到什么程度，就把对应样例展示给你看。","展示获准使用的匿名报告，逐项放大真实字段，不自行造分数。","看真实诊断样例","让抽象服务可视化"],["30–45s","重点不只是指出问题，还要看规划里怎么安排：先补哪部分，再学哪部分。报告和后面的行动能对上，你才能判断这份服务有没有用在需要的地方。","将报告薄弱项与规划安排同屏对齐，用光标指示。","薄弱项要接上学习安排","回应报告是否实用"],["45–55s","目前九块九的虚拟方案包含诊断与规划。点开详情，先了解服务怎么开展、怎么领，再判断是否适合孩子。","展示当前诊断规划权益和领取步骤。","9.9 元 · 先了解诊断服务","给出适配型引导"]],proof:["真实诊断报告的学科、章节和知识点字段","规划与诊断结论之间的实际对应"],objection:"认为诊断只是换种说法重复“基础弱”。",response:"用真实报告颗粒度和对应安排回答，不只讲重要性。",test:["开头问题粒度","孩子数学不好，具体是哪里？","孩子立体几何卡住，具体卡在哪一步？","3 秒留存","CTR"],unresolved:"不得承诺对每个学生都能一次性精准找到全部问题；具体诊断粒度必须与服务一致。"},{code:"B02",line:"B",title:"同样一道错题，下一步未必相同",audience:"面对错题只知道让孩子重做的家长",hypothesis:"部分家长可能把不同原因造成的错误采用同一种处理方式。",angle:"用教学情景提出不同可能，再引出需要判断原因的诊断服务。",structure:"同题对比 → 原因假设 → 诊断服务 → 对应规划 → 行动引导",format:"双栏白板教学演示＋真人讲解",facts:["diagnosis","price"],shots:[["0–5s","同一道题做错了，下一步都该再刷十道吗？","双栏白板写同一个教学问题；明确标注“情景示意”。","同样做错，先别急着加题","提出可辨别的问题"],["5–15s","一个人可能卡在概念，一个人可能卡在步骤。这里说的是两种可能，不是看一眼错题就能下的结论，先把情况了解清楚。","两栏分别写“概念？”“步骤？”，保留问号，不模拟真实诊断结果。","先了解原因","防止把示意当诊断"],["15–30s","我们提供一对一学情诊断与规划。先梳理学科、章节和知识点的薄弱项，再看该先补什么，让学习安排有具体依据。","展示获准使用的真实报告与规划服务材料。","诊断是为了安排下一步","解释购买价值"],["30–45s","家长可以重点看：报告里的问题，和规划里的动作是不是对应。需要补概念的，安排是什么；还有哪些情况需要继续了解，都应该说具体。","在真实样例中选择已存在的一组问题与动作，逐一对齐；不要补造报告字段。","问题与动作要对得上","提供评估服务的角度"],["45–55s","如果你不想只用“再做一遍”回应每道错题，可以看看九块九方案的诊断与规划说明，再决定是否需要。","展示当前价格与诊断服务内容。","9.9 元 · 了解诊断与规划","回应特定购买动机"]],proof:["用于拍摄的教学示意题，不能冒用真实学生案例","获准公开的诊断规划样例"],objection:"家长可能以为脚本在凭单题判定孩子问题。",response:"口播明确是两种可能，实际需要了解情况。",test:["教学演示形式","口播描述两个不同卡点。","白板双栏同时展示两个待判断卡点。","完播率","CTR"],unresolved:"没有实测诊断准确性；不得把教学演示包装成学生成功案例。"},{code:"B03",line:"B",title:"把日历填满之前，先回答一个问题",audience:"给孩子排了很多任务但缺少明确目标的家长",hypothesis:"排满时间可能让家长获得安排感，却没有解释任务和薄弱项的关系。",angle:"每项任务应能回答“在解决什么”，让诊断成为规划依据。",structure:"日历场景 → 追问目的 → 诊断定位 → 规划对照 → 行动引导",format:"两张计划示意卡＋俯拍＋报告实拍",facts:["diagnosis","price"],shots:[["0–5s","周末课表排得很满，每一项是在补什么？","俯拍标注“情景示意”的计划卡，指向其中一项。","这项任务，解决什么？","引出任务目的"],["5–15s","“做题一小时”是时间，“复习数学”是科目。它们还没有回答：孩子现在具体哪部分需要补，为什么先安排这一项。","白板区分时间、学科和具体薄弱项。","时间不等于学习目标","明确规划的信息缺口"],["15–30s","这套方案先提供一对一学情诊断，拆开学科、章节、知识点，再给出学习规划。让你先知道安排的依据，再去看时间怎么放。","展示真实诊断到规划的样例，指出实际有依据的安排。","有依据，再安排","把诊断价值转为视觉证据"],["30–45s","现在拿其中一项对照：报告里是什么问题，规划里建议先做什么。不要只看表格漂不漂亮，要看问题和动作能不能接上。","同屏呈现匿名报告与对应规划项，保持文字可读。","看对应关系，不只看表格","帮助用户判断服务"],["45–55s","当前九块九，纯虚拟交付。想把学习安排问得更具体，可以点开详情看看诊断和规划的服务方式。","真实权益页显示价格与服务方式。","9.9 元 · 看清服务方式","降低了解门槛"]],proof:["真实规划项确有诊断依据","无个人身份信息的报告画面"],objection:"担心只是拿到通用模板。",response:"同屏核对具体问题与具体安排，避免只展示漂亮排版。",test:["第一镜画面","先出镜讲“课表排得很满”。","先俯拍满日历并圈出一项任务。","3 秒留存","完播率"],unresolved:"不能仅凭一张示例规划承诺所有用户获得同等细节；需要核对实际服务标准。"},{code:"B04",line:"B",title:"先别把所有错题，都叫粗心",audience:"经常把孩子错题归因于粗心的家长",hypothesis:"“粗心”标签可能掩盖仍需了解的知识问题或步骤问题。",angle:"不替孩子下诊断，先把一个笼统标签转成能讨论的问题。",structure:"常见标签 → 追问细节 → 服务定位 → 样例展示 → 行动引导",format:"便签替换＋白板追问＋真人讲述",facts:["diagnosis","price"],shots:[["0–5s","又说孩子“粗心”之前，能说清是哪一步出了问题吗？","将写有“粗心”的便签拿开，露出“哪一步？”卡片。","先问具体卡点","替换笼统标签"],["5–15s","条件没看清、概念没理解、步骤没接上，需要进一步了解的地方并不相同。只留下两个字，下一次到底怎么准备，还是说不清。","白板列出待了解的三种可能，均带问号。","原因需要了解，不能猜","提示诊断必要性"],["15–30s","这套方案包含一对一学情诊断与学习规划，先梳理孩子的薄弱项，再看先补什么、后补什么。我们不靠一句话给孩子贴标签。","展示诊断服务流程和获准展示的匿名样例，不夸大检测能力。","诊断薄弱项，再看安排","解释服务作用"],["30–45s","你可以重点核对真实报告里的结论，有没有接到具体学习安排。涉及哪些知识点、下一步学哪部分，尽量让家长和孩子都能问得明白。","报告与规划并排，指向同一知识点。","结论要接上下一步","显示规划的可用性"],["45–55s","如果你想把“粗心”换成更具体的讨论，可以看九块九方案的诊断说明。先了解服务内容，再决定。","真实详情页展示诊断规划权益。","9.9 元 · 先看诊断说明","给出不夸大的行动入口"]],proof:["真实诊断服务所支持的信息范围","样例报告和学习规划"],objection:"家长担心被指责教育方式，或以为能识别所有心理原因。",response:"邀请具体讨论，不归责家长，不宣称诊断心理或注意力问题。",test:["开头语气","先别把所有错题都叫粗心。","孩子说自己粗心，下一步该问什么？","3 秒留存","CTR"],unresolved:"该服务是学情诊断，不是心理、医疗或注意力障碍诊断，脚本不扩展到这些能力。"},{code:"B05",line:"B",title:"一份报告，最后有没有下一步？",audience:"对测评报告的实际价值持怀疑态度的家长",hypothesis:"家长可能认为测评只是列问题，不能支持下一步行动。",angle:"用“报告和规划是否对应”作为可验证的服务评估标准。",structure:"购买质疑 → 核验标准 → 真实样例 → 适用边界 → 行动引导",format:"报告翻页实拍＋前后对照＋口播",facts:["diagnosis","price"],shots:[["0–5s","看一份学情报告，我会先找它写没写“下一步”。","翻到实际规划页，镜头保持文字可读；不伪造报告页。","报告之后，怎么做？","从用户质疑切入"],["5–15s","如果只告诉我哪科弱，我还会追问：弱到哪一章、哪一个知识点？接下来建议先补什么？这些问题比报告有多少页更具体。","用字幕列出三个核验问题；不贬低某个竞品。","定位 / 顺序 / 动作","给出判断标准"],["15–30s","这套九块九虚拟方案里，包含一对一学情诊断与学习规划。你看，报告里的这项薄弱点，在旁边的规划里有对应的学习安排。","拍摄真实匿名样例，薄弱点与安排同屏显示。","用真实样例看对应","提供可验证证据"],["30–45s","你可以据此判断服务是不是自己需要的。规划给的是学习方向和安排，孩子还需要实际参与，不能把一份报告当成已经发生的学习效果。","回到真人说明，再展示规划中的具体学习任务。","安排需要实际执行","建立准确购买预期"],["45–55s","想了解可以点开详情，先看诊断怎么开展、规划怎么交付，再核对当前九块九的权益和领取说明。","真实详情页停留在诊断规划说明。","先看交付，再决定","以透明信息促成行动"]],proof:["真实样例含可对应的薄弱项与安排","服务交付与领取说明"],objection:"担心买到没有行动建议的报告。",response:"直接展示结论与安排的对应，不以报告厚度替代价值。",test:["核心演示","报告与规划先后切换。","报告与规划同屏对齐。","CTR","CVR"],unresolved:"需要服务方提供获准公开的样例，无法用设计稿冒充真实报告。"},{code:"B06",line:"B",title:"“听懂了”和“能自己做”，中间卡在哪？",audience:"孩子自述听懂课程、独立练习仍遇到困难的家长",hypothesis:"口头的“听懂”可能不足以说明具体知识点的掌握情况。",angle:"把家长的追问从“到底懂没懂”转成“具体卡在哪里”。",structure:"对话场景 → 具体追问 → 诊断作用 → 规划展示 → 行动引导",format:"情景对话＋真人旁白＋报告演示",facts:["diagnosis","video","price"],shots:[["0–5s","孩子说“课上听懂了”，自己做题时又卡住，你会怎么问？","演员情境演示，角标注明“学习情景演示”，不作为真实反馈。","听懂以后，卡在哪一步？","建立常见但未统计的场景"],["5–15s","先别急着争“到底懂没懂”。题目问的是什么、用到哪个知识点、从哪一步开始不确定，把问题问小一点，才有继续讨论的地方。","白板列出三个追问，光标停留于具体步骤。","把大问题问小","给出具体沟通角度"],["15–30s","这套方案包含一对一学情诊断，梳理学科、章节和知识点薄弱项，再给学习规划。重点是了解当前问题，而不是根据一句话就下结论。","展示真实诊断流程与匿名样例，不模拟自动判定学生能力。","了解问题，再给规划","说明诊断的边界"],["30–45s","接着看这项薄弱点：规划里建议先学什么，又能对应到哪些视频内容。把学习安排看清楚，再和孩子一起讨论。","真实报告、规划、视频目录三者对应；仅展示确实存在的关联。","薄弱项 → 对应内容","让服务衔接可见"],["45–55s","当前九块九的虚拟方案，诊断、规划和课程权益都在详情里。想进一步了解，先看服务和领取说明。","当前权益页与领取入口实拍。","9.9 元 · 了解具体交付","引导进一步了解"]],proof:["真实诊断流程，不以演员反应证明服务有效","样例规划与课程内容对应"],objection:"家长可能期待系统直接判断所有解题障碍。",response:"描述了解与梳理过程，不承诺只听一句话或看一道题就准确诊断。",test:["开头主体","用家长提问开场。","用孩子“听懂但不会做”的情景开场。","3 秒留存","完播率与 CTR"],unresolved:"场景是创作假设，需真实评论与投放验证其代表性。"},{code:"B07",line:"B",title:"知道哪里弱，和知道先补什么，是两件事",audience:"已经知道孩子多处薄弱、但迟迟无法开始的家长",hypothesis:"用户可能已有问题清单，却缺少行动优先顺序。",angle:"把诊断的落点放到规划顺序，避免只制造“问题很多”的焦虑。",structure:"认知区分 → 顺序问题 → 产品机制 → 样例核对 → 行动引导",format:"便签清单排序＋真实报告规划",facts:["diagnosis","price"],shots:[["0–5s","知道孩子哪里弱，和知道先补什么，是两件事。","左侧放问题清单，右侧放待排列的学习任务便签。","有清单，还要有顺序","提出具体观点"],["5–15s","这章没跟上，那章也不踏实，如果只把问题越列越长，今晚还是不知道从哪儿开始。接下来需要的是一份说得清楚的安排。","将一长串“待了解问题”缩小为“先做什么？”提示；标注流程示意。","今晚从哪开始？","将问题转为行动需求"],["15–30s","我们这套方案提供一对一学情诊断与学习规划，先拆薄弱项，再给先补什么、后补什么的建议。两部分一起看，才知道怎么衔接。","真实诊断结论与规划顺序同屏，使用获准公开样例。","诊断和规划一起看","展示产品的组合价值"],["30–45s","你看这份样例里的对应关系：为什么安排这部分，下一步准备学什么，顺着同一个问题看下去。是否适合孩子，也要结合真实情况判断。","拍摄现有匿名样例；若只有模板则明确展示模板，不能配这段“实际样例”台词。","真实样例，核对安排","提升证据可见性"],["45–55s","目前九块九，全部虚拟交付。想先把补学顺序理清楚，可以点开详情，看看诊断规划的具体服务。","实拍当前详情页中的诊断与规划权益。","9.9 元 · 先了解补学规划","对准顺序需求引导"]],proof:["真实匿名样例而非空白模板","实际服务能够提供的学习先后建议"],objection:"担心诊断增加焦虑，最后仍不知道如何行动。",response:"将镜头和台词聚焦下一步，减少罗列问题。",test:["主卖点表述","先找全薄弱项。","先理清一个具体的补学顺序。","CTR","CVR"],unresolved:"真实样例缺失时必须补拍后使用，不能伪造报告或使用模板冒充定制结果。"},{code:"C01",line:"C",title:"平面上的图，脑子里怎么立起来？",audience:"空间关系理解有困难的高中生及家长",hypothesis:"部分学生对平面示意图所表达的立体关系缺少直观理解。",angle:"用实际动态模型展示观察过程，而不是只声称“更直观”。",structure:"视觉疑问 → 静态困惑 → 模型演示 → 学习边界 → 行动引导",format:"同一概念静态图与真实模型并排＋录屏旁白",facts:["models","price"],shots:[["0–5s","图画在纸上，空间里的位置关系，你真的看清了吗？","左侧教学示意图，右侧真实模型入口；概念必须一致。","把空间关系看清楚","提出视觉理解问题"],["5–15s","有时候卡住的，不只是某一句公式，而是图里哪个点、哪条线、哪个面在什么位置。先把这个问题单独拿出来看。","在教学示意图中标注点、线、面；不声称已判断某学生原因。","先看点、线、面的位置","明确本条只讲一个问题"],["15–30s","这套方案里有数理动态模型。现在就用对应的真实模型，把位置关系动态展示一遍：看哪里发生变化，再看哪些关系保持不变。","实拍产品已有的立体几何模型交互；只能使用界面实际支持的动作，不后期伪装交互。","变化在哪里？什么没变？","把模型价值直接展示出来"],["30–45s","看完先别急着说会了，试着自己解释图里的关系，再回到题目里检查。模型是帮助理解的工具，后面仍然需要自己思考和练习。","暂停真实模型，让演示者口头解释关系；这是教学演示，不是用户成绩证据。","看清 → 解释 → 回到题目","回应只看动画是否有用"],["45–55s","当前九块九虚拟方案包含两百个动态模型。想看具体内容和使用方式，点开详情，核对是否对应孩子的需要。","展示真实模型目录与当前权益页面。","200 个模型 · 9.9 元虚拟方案","引导查看模型范围"]],proof:["确实存在的立体几何模型和真实操作录屏","模型目录与当前 9.9 元使用权益"],objection:"担心只是好看的动画，不能支持理解。",response:"提出观察变化、说明关系、返回题目的具体学习动作。",test:["开头画面","先真人提问，
